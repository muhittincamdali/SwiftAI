# Link check settings shared by every repository (links.yml writes this file when a repository
# has none). Keep the exclusions short and explain each one: a link that is excluded is a link
# nobody checks.

# Re-check a link at most once a day; the cache is kept between workflow runs.
cache = true
max_cache_age = "1d"
cache_exclude_status = "429, 500.."

max_concurrency = 8
max_retries = 3
timeout = 20

# Anchors (#section) in Markdown and HTML files must exist, so README buttons and the table of
# contents cannot point at a renamed heading.
include_fragments = "anchor-only"

# 403/429 from rate limiting are not broken links; everything else outside 2xx is.
accept = ["200..=299", "403", "429"]

# Pages and raw.githubusercontent.com serve the default branch, so a pull request that adds a
# file or a DocC article would fail until it is merged. Check the checkout instead: the same
# file must exist, which also keeps the check honest after the merge. The path is where the
# shared workflow's runner checks this repository out.
remap = [
  '^https://raw\.githubusercontent\.com/muhittincamdali/SwiftAI/master/(.*)$ file:///home/runner/work/SwiftAI/SwiftAI/$1',
  '^https://muhittincamdali\.github\.io/SwiftAI/documentation/swiftai/?$ file:///home/runner/work/SwiftAI/SwiftAI/Sources/SwiftAI/SwiftAI.docc/SwiftAI.md',
  '^https://muhittincamdali\.github\.io/SwiftAI/documentation/swiftai/choosingamodel/?$ file:///home/runner/work/SwiftAI/SwiftAI/Sources/SwiftAI/SwiftAI.docc/ChoosingAModel.md',
  '^https://muhittincamdali\.github\.io/SwiftAI/documentation/swiftai/gettingstarted/?$ file:///home/runner/work/SwiftAI/SwiftAI/Sources/SwiftAI/SwiftAI.docc/GettingStarted.md',
  '^https://muhittincamdali\.github\.io/SwiftAI/documentation/swiftai/preparingdata/?$ file:///home/runner/work/SwiftAI/SwiftAI/Sources/SwiftAI/SwiftAI.docc/PreparingData.md',
  '^https://muhittincamdali\.github\.io/SwiftAI/documentation/swiftai/savingmodels/?$ file:///home/runner/work/SwiftAI/SwiftAI/Sources/SwiftAI/SwiftAI.docc/SavingModels.md',
]

exclude_loopback = true
exclude_private = true
exclude_link_local = true

exclude = [
  # Sites that answer automated requests with 999 or a sign-in wall.
  '^https://(www\.)?linkedin\.com/',
  '^https://(www\.)?x\.com/',
  # Placeholder hosts used in code samples.
  '^https?://(www\.)?example\.(com|org|net)',
  '^https?://api\.example\.com',
  # Pull request and comparison pages that only exist after a push.
  '^https://github\.com/[^/]+/[^/]+/compare/',
]

exclude_path = [
  "node_modules",
  ".build",
  "build",
  "Pods",
]
